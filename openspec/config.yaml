schema: spec-driven

context: |
  Proyecto: Retiro Despertar Frontend
  Dominio: Landing page y plataforma holística para retiros espirituales (Constelaciones Familiares, Reiki, Yoga y Gastronomía de Chef Privado).
  Documentación de Referencia:
  - docs/ARCHITECTURE.md (Patrón arquitectónico Jamstack/Next.js 15, flujo de datos, diagrama Mermaid, seguridad y arquitectura SEO/Ads).
  - docs/INSTRUCTIONS.md (Guía integral de negocio, DDL de Supabase, Cloudinary, auto-restore y políticas de Google/Meta Ads).
  - docs/create_retreats_table.sql (Script SQL DDL para tablas locations, retreats y registrations con RLS).

  Stack Tecnológico:
  - Framework: Next.js 15 (App Router) optimizado en modo standalone para contenedores Docker.
  - UI & Estilos: React 19, TypeScript estricto, Tailwind CSS (enfoque Mobile-First).
  - Backend Serverless & Base de Datos: Supabase (PostgreSQL con políticas Row Level Security - RLS).
  - Multimedia: Cloudinary (API Routes proxies / listado dinámico por tags y carpetas de ubicaciones).
  - Testing: Vitest + React Testing Library (cobertura lógica completa).

  Políticas de Google Ads, Meta Ads & SEO Excelente:
  - Cumplimiento de Políticas de Salud y Anuncios: Descargo explícito de responsabilidad indicando que las actividades son de bienestar holístico y desarrollo personal (sin ofrecer diagnósticos médicos ni promesas de sanación clínica).
  - Enlaces Legales Permanentes: Acceso visible desde el footer a /privacidad (Política de Privacidad) y /terminos (Términos y Condiciones).
  - SEO Técnico: Metadatos OpenGraph, Twitter Cards, URLs canónicas, JSON-LD Schema.org (Organization/Event) y jerarquía semántica HTML5 con un solo <h1> por página.

  Estructura de Datos (Supabase):
  - locations (id, name, address, maps_url, directions, created_at).
  - retreats (id, title, start_date, end_date, location_id FK, is_confirmed, status_text, created_at).
  - registrations (id, full_name, email, phone, interest_discipline, message, created_at).

  Arquitectura y Directrices de Desarrollo:
  - Estética Orgánica Zen: Fondos cálidos (stone-50, amber-50/40), acentos verdes (emerald-800, emerald-700), textos carbón (stone-800), bordes suavizados (rounded-2xl/3xl) y sombras sutiles.
  - Mobile-First Absoluto: Clases base de Tailwind CSS aplicadas directamente al móvil. Breakpoints (md:, lg:) para escritorio. Contenedor principal limitado a max-w-7xl mx-auto px-4 sm:px-6 lg:px-8.
  - Patrón de Estrategia: Uso de mapas de dispatch / declarativos en lugar de condicionales anidados (if-else/switch).
  - Resiliencia (Auto-Restore): Si la DB de Supabase se pausa por inactividad (>2 días tier gratuito), FormRegister invoca POST /api/supabase/restore usando SUPABASE_MANAGEMENT_PAT para despertar el proyecto.
  - Seguridad y Entornos:
    * Variables NEXT_PUBLIC_ (SUPABASE_URL, ANON_KEY, WHATSAPP_NUMBER) expuestas al cliente.
    * Secretos de Servidor (CLOUDINARY_CLIENT_SECRET, SUPABASE_MANAGEMENT_PAT) aislados en Next.js API Routes (/src/app/api/...).
    * Políticas RLS: INSERT público en registrations (lectura SELECT bloqueada para privacidad), SELECT público en retreats y locations.
  - Testing: Cobertura estricta con Vitest; ningún cambio lógico debe subirse sin sus tests unitarios correspondientes.

rules:
  proposal:
    - Consultar siempre los documentos en docs/ (ARCHITECTURE.md e INSTRUCTIONS.md) para verificar restricciones de dominio, SEO y políticas publicitarias.
    - Asegurar que todo cambio mantenga la conformidad con Google Ads y Meta Ads (páginas de privacidad, términos y descargo de responsabilidad de salud).
    - Describir claramente el objetivo, impacto en el usuario y alineación visual zen del sitio.
    - Especificar cambios necesarios en frontend, esquemas Supabase (docs/create_retreats_table.sql), proxies Cloudinary o tests.
  spec:
    - Mantener sincronía estricta con las especificaciones técnicas descritas en docs/.
    - Garantizar que los requerimientos cumplan las reglas de SEO excelente (metadatos, Schema.org, accesibilidad alt, HTML5 semántico).
    - Incluir requerimientos funcionales detallados, diagramas o estructuras de datos y criterios de aceptación verificables.
  tasks:
    - Dividir las tareas en bloques manejables e independientes.
    - Incluir siempre el paso de verificación con tests unitarios (npx vitest run) y comprobación de tipos (npx tsc --noEmit).
