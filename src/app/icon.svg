<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo circular verde esmeralda con espacio cómodo (emerald-700 / #047857) -->
  <circle cx="16" cy="16" r="16" fill="#047857" />
  
  <!-- Icono Despertar centrado con padding armónico -->
  <g transform="translate(4, 4)" fill="none" stroke="#fafaf9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contorno del ojo -->
    <path d="M 1 15.5 C 5 22.5 19 22.5 23 15.5" stroke-width="1.8" />
    <path d="M 1 15.5 C 5 11.2 19 11.2 23 15.5" stroke-width="1.8" />

    <!-- Sol -->
    <circle cx="12" cy="12" r="4.9" fill="#fafaf9" stroke="none" />

    <!-- Rayos -->
    <g stroke-width="1.2">
      <line x1="12" y1="6.0" x2="12" y2="3.4" />
      <line x1="9.1" y1="6.9" x2="7.8" y2="4.6" />
      <line x1="14.9" y1="6.9" x2="16.2" y2="4.6" />
      <line x1="7.2" y1="8.7" x2="5.1" y2="7.1" />
      <line x1="16.8" y1="8.7" x2="18.9" y2="7.1" />
      <line x1="6.3" y1="10.7" x2="3.7" y2="10.7" />
      <line x1="17.7" y1="10.7" x2="20.3" y2="10.7" />
    </g>
  </g>
</svg>
